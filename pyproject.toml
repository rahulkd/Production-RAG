[project]
name = "moai-zero-to-rag"
version = "0.1.0"
description = "Mother-of-AI Phase-1-Zero to RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "uvicorn>=0.34.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13.3",
    "opensearch-py>=3.0.0",
    "boto3>=1.43.0",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "docling>=2.43.0",
    "python-dateutil>=2.9.0.post0",
    # Headless OpenCV — provides the `cv2` import that docling/rapidocr need,
    # without the GUI/system libs. See the [tool.uv] override below.
    "opencv-python-headless>=4.10",
]
readme = "README.md"

[dependency-groups]
dev = [
    "anyio[trio]>=4.9.0",
    "asgi-lifespan>=2.1.0",
    "jupyter>=1.1.1",
    "mypy>=1.15.0",
    "notebook>=7.4.4",
    "polyfactory>=2.21.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov>=6.1.1",
    # NOTE: pytest-env is deliberately absent. It and pytest-dotenv both
    # register a `--envfile` option, and having both installed aborts pytest at
    # plugin load with "option names {'--envfile'} already added". Only
    # pytest-dotenv's `env_files` setting is used (see below), so it wins.
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.5",
    "testcontainers>=4.10.0",
    "types-sqlalchemy>=1.4.53.38",
]

[tool.uv]
# Force the headless OpenCV build. opencv-python is pulled in transitively
# (docling -> rapidocr) and its bootstrap inserts its package dir onto sys.path,
# which shadows the stdlib `typing` module under the uvicorn --reload spawn
# bootstrap and crashes startup. We override the GUI opencv-python out of
# resolution (never-matching marker) and depend on opencv-python-headless
# instead, which still provides the `cv2` import rapidocr needs.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.ruff]
line-length = 130
exclude = ["notebooks/**", ".venv/**"]
src = ["src", "tests"]
lint.select = [
  "I",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env_files = ".env.test"
# Without testpaths/norecursedirs pytest also collects the vendored
# assistant-ui monorepo's unrelated test files, and the standalone scripts
# under testing/ which require live services.
testpaths = ["tests"]
norecursedirs = ["assistant-ui", "frontend", "notebooks", ".venv", "testing", "data"]
markers = ["integration: requires OpenSearch/Postgres/Bedrock/Jina"]

[tool.mypy]
explicit_package_bases = true
ignore_errors = true


